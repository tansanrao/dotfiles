min_version = "2026.10.6"

[settings]
idiomatic_version_file_enable_tools = ["node", "rust", "swift", "python"]
# uv owns project environments; mise activates them when uv.lock is present.
python.uv_venv_auto = "source"

# Preserve the versions used before migration. Rust continues to use the
# existing ~/.cargo and ~/.rustup directories, including installed binaries.
[tools]
node = "24"
pnpm = "12"
rust = { version = "1.99", profile = "default" }
fzf = "0.74.4"
zoxide = "0.10.0"
typst = "0.15.1"
ripgrep = "15.2.0"
uv = "0.12.24"

# bin/install exposes this checkout as a global conf.d directory module.
# Sources resolve within that module, including when the checkout is relocated.
# Link individual files so application-generated state remains unmanaged.
[dotfiles]
"~/.zshrc" = { source = ".zshrc", mode = "symlink" }
"~/.zprofile" = { source = ".zprofile", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = ".config/tmux/tmux.conf", mode = "symlink" }
"~/.config/ghostty/config.ghostty" = { source = ".config/ghostty/config.ghostty", mode = "symlink" }
"~/.config/zed/settings.json" = { source = ".config/zed/settings.json", mode = "symlink" }
